services:
  web:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./instance:/app/instance
    environment:
      # Chemin absolu (4 slashs) : la base reste dans le volume ./instance
      - DATABASE_URL=sqlite:////app/instance/database.db
      - PROJECTS_FILE=/app/instance/projects.json
      # Aucune valeur par défaut : le conteneur refuse de démarrer sans SECRET_KEY dans .env
      - SECRET_KEY=${SECRET_KEY:?Définis SECRET_KEY dans le fichier .env (voir .env.example)}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    restart: unless-stopped
