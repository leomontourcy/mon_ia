version: '3.8'

services:
  web:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./instance:/app/instance
    environment:
      - DATABASE_URL=sqlite:///instance/database.db
      - SECRET_KEY=${SECRET_KEY:-default_insecure_key_change_me_in_production}
    restart: unless-stopped
