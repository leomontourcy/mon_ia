<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inscription - LEOai</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
              rel="stylesheet">
        <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-base: #000000;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-purple: #ff1493;
            --accent-pink: #ff007f;
            --radius-lg: 24px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(ellipse, rgba(255, 0, 127, 0.25) 0%, rgba(255, 20, 147, 0.05) 40%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 8s ease-in-out infinite alternate;
        }
        @keyframes glowPulse {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            z-index: 1;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .logo-bubble {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 20px rgba(255, 20, 147, 0.2);
            transition: var(--transition);
            margin-bottom: 24px;
        }
        .logo-bubble:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 30px rgba(255, 20, 147, 0.4);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
        }
        .logo-img {
            max-height: 45px;
            margin: 0;
        }
        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.8em;
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 12px 16px;
            font-size: 1em;
            outline: none;
            transition: var(--transition);
        }
        .form-input:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 0 2px rgba(255,0,127,0.2);
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border: none;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.05em;
            padding: 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.3);
        }
        .submit-btn:hover {
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.5);
            transform: translateY(-2px);
        }
        .switch-link {
            display: block;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 0.85em;
            text-decoration: none;
            transition: var(--transition);
        }
        .switch-link:hover {
            color: var(--accent-pink);
        }
        .flash-messages {
            margin-bottom: 20px;
            color: #ef4444;
            font-size: 0.9em;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        </style>
    </head>
    <body>
        <div class="bg-glow"></div>
        <div class="auth-card">
            <div class="logo-bubble">
                <img src="/static/logo_ai.png" alt="LEOai" class="logo-img">
            </div>
            <h1 class="title">Créer un compte</h1>
            <p class="subtitle">Rejoins l'aventure de la création vidéo.</p>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for message in messages %}
                            {{ message }}
                            <br>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            <form method="POST" action="/register">
                <div class="form-group">
                    <label class="form-label">Pseudo</label>
                    <input type="text"
                           name="username"
                           class="form-input"
                           required
                           placeholder="Ton pseudo">
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password"
                           name="password"
                           class="form-input"
                           required
                           placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn">S'inscrire</button>
            </form>
            <a href="/login" class="switch-link">Tu as déjà un compte ? Se connecter</a>
        </div>
    </body>
</html>
